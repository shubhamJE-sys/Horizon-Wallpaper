name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the newest code zip and every scene zip
        id: z
        run: |
          # code zip = the newest HorizonLauncher_v*.zip (any other .zip that is not a scene zip also counts, as before)
          Z=$(ls -1 *.zip 2>/dev/null | grep -v '^HorizonScene_' | sort -V | tail -n 1 || true)
          if [ -z "$Z" ]; then
            echo "No code .zip in the repo root yet: upload HorizonLauncher_v*.zip, then this builds."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Code zip: $Z"
          rm -rf _src && mkdir _src && unzip -q "$Z" -d _src
          # scene zips (HorizonScene_*.zip) hold only pictures, laid out like the project; they are unpacked on top of the code
          for S in HorizonScene_*.zip; do
            if [ -f "$S" ]; then echo "Scene zip: $S"; unzip -q -o "$S" -d _src; fi
          done
          P=$(find _src -maxdepth 4 -name settings.gradle | head -n 1)
          if [ -z "$P" ]; then echo "settings.gradle not found inside $Z"; exit 1; fi
          D=$(dirname "$P")
          echo "Project folder: $D"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "VERSION=$(grep -oP "versionName '\K[^']+" "$D/app/build.gradle")" >> "$GITHUB_ENV"
          echo "CODE=$(grep -oP "versionCode \K[0-9]+" "$D/app/build.gradle")" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        if: steps.z.outputs.found == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.z.outputs.found == 'true'
        with:
          gradle-version: 8.9
      - name: Build debug APK
        if: steps.z.outputs.found == 'true'
        working-directory: ${{ steps.z.outputs.dir }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: steps.z.outputs.found == 'true'
        with:
          name: HorizonLauncher-v${{ env.VERSION }}-code${{ env.CODE }}
          path: ${{ steps.z.outputs.dir }}/app/build/outputs/apk/debug/*.apk
